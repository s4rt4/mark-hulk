[package]
name = "mark-hulk"
version = "0.2.0"
description = "A fast, lightweight native GTK4 Markdown viewer and editor"
authors = ["s4rt4"]
edition = "2021"
license = "MIT"

[[bin]]
name = "mark-hulk"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.9", package = "gtk4", features = ["v4_10"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_4"] }
sourceview5 = { version = "0.9", features = ["v5_4"] }
pulldown-cmark = "0.12"
walkdir = "2"
notify = "6"
async-channel = "2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
