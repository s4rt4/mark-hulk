[package]
name = "mark-hulk"
version = "0.2.4"
description = "A fast, lightweight native GTK4 Markdown viewer and editor"
authors = ["s4rt4"]
edition = "2021"
license = "MIT"

[[bin]]
name = "mark-hulk"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.9", package = "gtk4", features = ["v4_10"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_4"] }
sourceview5 = { version = "0.9", features = ["v5_4"] }
pulldown-cmark = "0.12"
walkdir = "2"
notify = "6"
async-channel = "2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
cairo-rs = { version = "0.20", features = ["pdf"] }
pangocairo = "0.20"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# ---- .rpm packaging (cargo-generate-rpm) --------------------------------
# Build with:  cargo build --release && cargo generate-rpm
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/mark-hulk", dest = "/usr/bin/mark-hulk", mode = "0755" },
    { source = "data/com.sarta.mark-hulk.desktop", dest = "/usr/share/applications/com.sarta.mark-hulk.desktop", mode = "0644" },
    { source = "mark-hulk.svg", dest = "/usr/share/icons/hicolor/scalable/apps/com.sarta.mark-hulk.svg", mode = "0644" },
    { source = "LICENSE", dest = "/usr/share/licenses/mark-hulk/LICENSE", mode = "0644" },
    { source = "README.md", dest = "/usr/share/doc/mark-hulk/README.md", mode = "0644" },
]

[package.metadata.generate-rpm.requires]
gtk4 = "*"
libadwaita = "*"
gtksourceview5 = "*"
